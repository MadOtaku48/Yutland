<script>

// ── View — ZOOMED IN ──
let viewX = 4, viewY = 6;
let zoom = 1.0;
let scale = 30;
function autoScale() { scale = Math.min(W, H) / 22 * zoom; }
autoScale();

function toS(x, y) {
  return { x: W/2 + (x - viewX) * scale, y: H/2 - (y - viewY) * scale };
}

// Mouse wheel zoom
C.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.3, Math.min(3, zoom));
  autoScale();
  draw();
}, { passive: false });

// Pan with mouse drag
let dragging = false, dragX, dragY;
C.addEventListener('mousedown', e => { dragging = true; dragX = e.clientX; dragY = e.clientY; });
C.addEventListener('mousemove', e => {
  if (dragging) {
    viewX -= (e.clientX - dragX) / scale;
    viewY += (e.clientY - dragY) / scale;
    dragX = e.clientX; dragY = e.clientY;
    draw();
  }
  handleHover(e);
});
C.addEventListener('mouseup', () => dragging = false);

addEventListener('resize', () => { W = C.width = innerWidth; H = C.height = innerHeight; autoScale(); if (typeof allShips !== 'undefined') draw(); });

// ── Interpolation ──
function lerp(a,b,f) { return a+(b-a)*f; }
function lerpA(a,b,f) { let d=b-a; if(d>180)d-=360; if(d<-180)d+=360; return a+d*f; }

function posAt(wp, time) {
  if (time <= wp[0].t) return wp[0];
  if (time >= wp[wp.length-1].t) return wp[wp.length-1];
  for (let i=0; i<wp.length-1; i++) {
    if (time >= wp[i].t && time <= wp[i+1].t) {
      const f = (time - wp[i].t) / (wp[i+1].t - wp[i].t);
      return { x: lerp(wp[i].x,wp[i+1].x,f), y: lerp(wp[i].y,wp[i+1].y,f), crs: lerpA(wp[i].crs,wp[i+1].crs,f) };
    }
  }
  return wp[0];
}

// ── Formation column helper ──
// Each following ship is TIME-DELAYED behind the leader.
// At ~25kts with 0.5nm spacing, delay ≈ 0.5/25*60 ≈ 1.2 min per ship.
// This means each ship reaches each turn point LATER, creating realistic sequential turns.
function makeCol(lead, ships, gap) {
  // Build a dense path from lead waypoints for smooth interpolation
  const SPEED_KTS = 23; // average speed in knots
  const DELAY_PER_SHIP = (gap / SPEED_KTS) * 60; // minutes delay per position in column

  return ships.map((s, i) => {
    const delay = i * DELAY_PER_SHIP;
    // Ship i's position at time T = leader's position at time (T - delay)
    // We store this as a function rather than pre-computed waypoints
    return { ...s, delay, leadWp: lead };
  });
}

// Get position for a column ship: look up leader's position at (t - delay)
// If leaderTime < first waypoint, extrapolate backwards along initial course
function colShipPos(ship, time) {
  const leaderTime = time - ship.delay;
  const wp = ship.leadWp;
  if (leaderTime < wp[0].t) {
    // Extrapolate backwards: place ship behind leader along initial course
    const dt = (wp[0].t - leaderTime) / 60; // hours
    const spdNm = 23; // knots = nm/hr
    const dist = dt * spdNm; // nm to go back
    const rad = (wp[0].crs + 180) * Math.PI / 180; // reverse of course
    return {
      x: wp[0].x + Math.sin(rad) * dist,
      y: wp[0].y + Math.cos(rad) * dist,
      crs: wp[0].crs
    };
  }
  return posAt(wp, leaderTime);
}

// ── Firing assignments (who shoots whom, by time) ──

// ── Track history ──
const tracks = {};
function recordTrack(ship, pos) {
  if (!tracks[ship.id]) tracks[ship.id] = [];
  const tr = tracks[ship.id];
  if (tr.length===0 || Math.hypot(tr[tr.length-1].x-pos.x, tr[tr.length-1].y-pos.y) > 0.03) {
    tr.push({x:pos.x, y:pos.y});
  }
}
function resetTracks() { for (const k in tracks) delete tracks[k]; }

// ── Drawing helpers ──
function drawSea() {
  ctx.fillStyle = '#0d1b2a';
  ctx.fillRect(0,0,W,H);
  // Subtle grid
  ctx.strokeStyle = 'rgba(100,140,180,0.06)';
  ctx.lineWidth = 1;
  for (let x=-20;x<=30;x+=2) { const a=toS(x,-30),b=toS(x,30); ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }
  for (let y=-30;y<=30;y+=2) { const a=toS(-20,y),b=toS(30,y); ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }
  // Compass
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='bold 14px sans-serif';
  const n=toS(viewX-W/scale/2+1.5, viewY+H/scale/2-1);
  ctx.fillText('N↑',n.x,n.y);
  // Scale bar
  const s1=toS(viewX-W/scale/2+1, viewY-H/scale/2+1.5), s2=toS(viewX-W/scale/2+6, viewY-H/scale/2+1.5);
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(s1.x,s1.y);ctx.lineTo(s2.x,s2.y);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='10px sans-serif';
  ctx.fillText('5 nm',(s1.x+s2.x)/2-12,s1.y-6);
}

function drawTrack(ship) {
  const tr = tracks[ship.id];
  if (!tr || tr.length < 2) return;
  ctx.save();
  ctx.strokeStyle = ship.c;
  ctx.globalAlpha = 0.2;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  let p = toS(tr[0].x, tr[0].y);
  ctx.moveTo(p.x, p.y);
  for (let i=1;i<tr.length;i++) { p=toS(tr[i].x,tr[i].y); ctx.lineTo(p.x,p.y); }
  ctx.stroke();
  ctx.restore();
}

function drawShipShape(sx, sy, crs, color, sz, highlight) {
  const rad = (crs - 90) * Math.PI / 180;
  const L = sz * 2.2;   // half-length
  const B = sz * 0.4;   // half-beam
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rad);

  // Hull outline — pointed bow, tapered stern, slight beam curve
  ctx.beginPath();
  ctx.moveTo(L, 0);                          // bow tip
  ctx.bezierCurveTo(L*0.6, -B*0.6, L*0.3, -B, 0, -B);   // bow curve starboard
  ctx.lineTo(-L*0.6, -B*0.85);              // midship → stern taper
  ctx.quadraticCurveTo(-L, -B*0.5, -L*0.9, 0); // stern starboard
  ctx.quadraticCurveTo(-L, B*0.5, -L*0.6, B*0.85); // stern port
  ctx.lineTo(0, B);                          // stern taper → midship
  ctx.bezierCurveTo(L*0.3, B, L*0.6, B*0.6, L, 0); // bow curve port
  ctx.closePath();

  ctx.fillStyle = color;
  ctx.fill();

  if (highlight) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 0.6;
  ctx.stroke();

  // Superstructure — small darker rectangle amidships
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(-L*0.15, -B*0.4, L*0.35, B*0.8);

  // Turrets — two dots fore and aft
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(L*0.45, 0, B*0.35, 0, Math.PI*2); ctx.fill();  // fore turret
  ctx.beginPath(); ctx.arc(-L*0.35, 0, B*0.35, 0, Math.PI*2); ctx.fill(); // aft turret

  ctx.restore();
}

function drawShip(ship, time) {
  const isHSF = hsfShips.includes(ship);

  // HSF hidden before ~16:30
  if (isHSF && time < 988) {
    if (time > 983) {
      const pos = colShipPos(ship, time);
      const p = toS(pos.x, pos.y);
      ctx.save();
      ctx.globalAlpha = (time-983)/8 * 0.3;
      ctx.fillStyle = '#e67e22';
      ctx.font = '10px sans-serif';
      ctx.fillText('?', p.x-3, p.y+3);
      ctx.restore();
    }
    return;
  }

  // Sunk — show wreck marker
  if (ship.sunk && time > ship.sunk + 3) {
    const sp = colShipPos(ship, ship.sunk);
    const p = toS(sp.x, sp.y);
    ctx.save();
    ctx.fillStyle = '#ff4444';
    ctx.font = '13px serif';
    ctx.fillText('✕', p.x-5, p.y+4);
    ctx.globalAlpha = 0.7;
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText(ship.kr, p.x+10, p.y+3);
    ctx.restore();
    return;
  }

  const pos = colShipPos(ship, time);
  recordTrack(ship, pos);
  const p = toS(pos.x, pos.y);
  const sz = isHSF ? 8 : 10;

  // Sinking animation
  if (ship.sunk && time >= ship.sunk && time <= ship.sunk + 3) {
    const f = (time - ship.sunk) / 3;
    ctx.save();
    ctx.globalAlpha = 1 - f*0.6;
    drawShipShape(p.x, p.y, pos.crs, '#ff4400', sz * (1+f*0.5), false);
    // Fireball
    const r = 5 + f*35;
    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,`rgba(255,200,50,${1-f})`);
    g.addColorStop(0.5,`rgba(255,60,0,${0.7-f*0.7})`);
    g.addColorStop(1,'rgba(80,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
    // Label
    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ship.kr + ' 침몰', p.x, p.y - r - 8);
    ctx.restore();
    return;
  }

  // Normal ship
  drawShipShape(p.x, p.y, pos.crs, ship.c, sz, false);

  // ── ALWAYS show name label ──
  ctx.save();
  ctx.fillStyle = ship.c;
  ctx.font = 'bold 11px sans-serif';
  ctx.globalAlpha = 0.9;
  ctx.fillText(ship.kr, p.x + 14, p.y + 4);
  ctx.restore();
}

// ── Firing lines — clear labeled arrows ──
function drawFiring(time) {
  const now = performance.now();
  for (const f of firingTable) {
    if (time < f.t0 || time > f.t1) continue;
    const fromShip = allShips.find(s => s.id === f.from);
    const toShip = allShips.find(s => s.id === f.to);
    if (!fromShip || !toShip) continue;
    if (fromShip.sunk && time > fromShip.sunk) continue;
    if (toShip.sunk && time > toShip.sunk) continue;

    // Intermittent flash effect
    const phase = Math.sin(now * 0.003 + f.from.charCodeAt(0)*7);
    if (phase < -0.3) continue;

    const fp = colShipPos(fromShip, time);
    const tp = colShipPos(toShip, time);
    const p1 = toS(fp.x, fp.y);
    const p2 = toS(tp.x, tp.y);

    // Line
    ctx.save();
    ctx.globalAlpha = 0.12 + phase * 0.05;
    ctx.strokeStyle = f.c;
    ctx.lineWidth = 1;
    ctx.setLineDash([6,6]);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrowhead at ~80% of the way
    const ax = lerp(p1.x, p2.x, 0.75);
    const ay = lerp(p1.y, p2.y, 0.75);
    const angle = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = f.c;
    ctx.beginPath();
    ctx.moveTo(ax + Math.cos(angle)*6, ay + Math.sin(angle)*6);
    ctx.lineTo(ax + Math.cos(angle+2.5)*5, ay + Math.sin(angle+2.5)*5);
    ctx.lineTo(ax + Math.cos(angle-2.5)*5, ay + Math.sin(angle-2.5)*5);
    ctx.closePath();
    ctx.fill();

    // Shell splashes near target
    if (phase > 0.5) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#fff';
      const sx = p2.x + (Math.random()-0.5)*10;
      const sy = p2.y + (Math.random()-0.5)*10;
      ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function showEvent(time) {
  const el = document.getElementById('event');
  let active = null;
  for (const ev of events) { if (time >= ev.t && time < ev.t + (ev.dur||3)) active = ev; }
  if (active) {
    el.style.display = 'block';
    el.textContent = active.text;
    el.className = active.crit ? 'critical' : '';
  } else {
    el.style.display = 'none';
  }
}

// ── Tooltip ──
function handleHover(e) {
  const mx = e.clientX, my = e.clientY;
  const tip = document.getElementById('tooltip');
  let found = null;
  for (const s of allShips) {
    if (s.sunk && t > s.sunk + 3) continue;
    if (hsfShips.includes(s) && t < 988) continue;
    const pos = colShipPos(s, t);
    const p = toS(pos.x, pos.y);
    if (Math.hypot(p.x-mx, p.y-my) < 20) { found = s; break; }
  }
  if (found) {
    const pos = colShipPos(found, t);
    tip.style.display = 'block';
    tip.style.left = (mx+18)+'px';
    tip.style.top = (my-15)+'px';
    let html = `<b>${found.kr}</b> <span style="color:#aaa">${found.en}</span><br>`;
    html += `침로: ${Math.round(pos.crs)}°`;
    // Find what this ship is firing at
    const firing = firingTable.find(f => f.from === found.id && t >= f.t0 && t <= f.t1);
    if (firing) {
      const target = allShips.find(s => s.id === firing.to);
      if (target) html += `<br>교전 대상: <b style="color:${target.c}">${target.kr}</b>`;
    }
    // Find what's firing at this ship
    const incoming = firingTable.filter(f => f.to === found.id && t >= f.t0 && t <= f.t1);
    if (incoming.length) {
      const attackers = incoming.map(f => allShips.find(s=>s.id===f.from)).filter(Boolean);
      html += `<br>피격 중: ${attackers.map(a=>`<b style="color:${a.c}">${a.kr}</b>`).join(', ')}`;
    }
    if (found.sunk) html += `<br><span style="color:#ff6b6b">침몰: ${fmtTime(found.sunk)}</span>`;
    tip.innerHTML = html;
  } else {
    tip.style.display = 'none';
  }
}

// ── Auto-center ──
function updateView(time) {
  const bp = colShipPos(bcfShips[0], time);
  const gp = colShipPos(sg1Ships[0], time);
  const cx = (bp.x + gp.x) / 2;
  const cy = (bp.y + gp.y) / 2;
  viewX += (cx - viewX) * 0.04;
  viewY += (cy - viewY) * 0.04;
}

// ── Main draw ──
function draw() {
  autoScale();
  drawSea();

  // Tracks
  allShips.forEach(s => drawTrack(s));

  // Firing lines (behind ships)
  drawFiring(t);

  // Ships (back to front: HSF, SG1, BS5, BCF)
  hsfShips.forEach(s => drawShip(s, t));
  sg1Ships.forEach(s => drawShip(s, t));
  bs5Ships.forEach(s => drawShip(s, t));
  bcfShips.forEach(s => drawShip(s, t));

  showEvent(t);
  document.getElementById('timeDisplay').textContent = fmtTime(t);
  document.getElementById('timeline').value = ((t-T0)/(T1-T0))*10000;
}

function fmtTime(m) { return `${Math.floor(m/60)}:${String(Math.floor(m%60)).padStart(2,'0')}`; }

// ── Animation ──
function animate(ts) {
  if (!playing) return;
  if (!lastTs) lastTs = ts;
  const dt = (ts-lastTs)/1000;
  lastTs = ts;
  t += dt * speed * 0.4;
  if (t>=T1) { t=T1; playing=false; document.getElementById('playBtn').textContent='▶ 재생'; }
  if (!dragging) updateView(t);
  draw();
  raf = requestAnimationFrame(animate);
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    if (t>=T1) { t=T0; resetTracks(); }
    document.getElementById('playBtn').textContent='⏸ 일시정지';
    lastTs=0;
    raf=requestAnimationFrame(animate);
  } else {
    document.getElementById('playBtn').textContent='▶ 재생';
    cancelAnimationFrame(raf);
  }
}

function seek(v) {
  const nt = T0+(v/10000)*(T1-T0);
  if (nt<t) resetTracks();
  t=nt;
  for (let tt=T0;tt<=t;tt+=0.3) allShips.forEach(s=>recordTrack(s,colShipPos(s,tt)));
  updateView(t);
  draw();
}

function changeSpeed() {
  const sp=[0.5,1,2,4,8];
  speed=sp[(sp.indexOf(speed)+1)%sp.length];
  document.getElementById('spdBtn').textContent=speed+'x';
}

// ── Keyboard ──
addEventListener('keydown', e => {
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowRight'){t=Math.min(t+0.5,T1);draw();}
  if(e.code==='ArrowLeft'){t=Math.max(t-0.5,T0);draw();}
});

// ── Init ──
autoScale();
updateView(T0);
draw();
</script>
