function autoScale(){scale=Math.min(W,H)/26*zoom;}autoScale();
function toS(x,y){return{x:W/2+(x-viewX)*scale,y:H/2-(y-viewY)*scale};}

C.addEventListener('mousedown',e=>{dragging=true;dragX=e.clientX;dragY=e.clientY;});

function lerp(a,b,f){return a+(b-a)*f;}
function lerpA(a,b,f){let d=b-a;if(d>180)d-=360;if(d<-180)d+=360;return a+d*f;}
function posAt(wp,time){if(time<=wp[0].t)return wp[0];if(time>=wp[wp.length-1].t)return wp[wp.length-1];for(let i=0;i<wp.length-1;i++){if(time>=wp[i].t&&time<=wp[i+1].t){const f=(time-wp[i].t)/(wp[i+1].t-wp[i].t);return{x:lerp(wp[i].x,wp[i+1].x,f),y:lerp(wp[i].y,wp[i+1].y,f),crs:lerpA(wp[i].crs,wp[i+1].crs,f)};}}return wp[0];}
function makeCol(lead,ships,gap){const SPD=20,DELAY=(gap/SPD)*60;return ships.map((s,i)=>({...s,delay:i*DELAY,leadWp:lead}));}
function colShipPos(ship,time){const lt=time-ship.delay,wp=ship.leadWp;if(lt<wp[0].t){const dt=(wp[0].t-lt)/60,r=(wp[0].crs+180)*Math.PI/180;return{x:wp[0].x+Math.sin(r)*dt*20,y:wp[0].y+Math.cos(r)*dt*20,crs:wp[0].crs};}return posAt(wp,lt);}

  {from:'kaiser',to:'warspt',  t0:1108,t1:1115,c:'#d4770a'},

  // König ← Iron Duke
  {from:'konig',to:'ironduke', t0:1102,t1:1118,c:'#e67e22'},
];

// ═══ TRACKS ═══
const tracks={};function recordTrack(s,p){if(!tracks[s.id])tracks[s.id]=[];const tr=tracks[s.id];if(tr.length===0||Math.hypot(tr[tr.length-1].x-p.x,tr[tr.length-1].y-p.y)>.03)tr.push({x:p.x,y:p.y});}
function resetTracks(){for(const k in tracks)delete tracks[k];}

// ═══ DRAWING ═══
function drawSea(){ctx.fillStyle='#0d1b2a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(100,140,180,.06)';ctx.lineWidth=1;for(let x=-20;x<=30;x+=2){const a=toS(x,-20),b=toS(x,40);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}for(let y=-20;y<=40;y+=2){const a=toS(-20,y),b=toS(30,y);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='bold 14px sans-serif';const n=toS(viewX-W/scale/2+1.5,viewY+H/scale/2-1);ctx.fillText('N↑',n.x,n.y);}
function drawTrack(s){const tr=tracks[s.id];if(!tr||tr.length<2)return;ctx.save();ctx.strokeStyle=s.c;ctx.globalAlpha=.2;ctx.lineWidth=1.5;ctx.beginPath();let p=toS(tr[0].x,tr[0].y);ctx.moveTo(p.x,p.y);for(let i=1;i<tr.length;i++){p=toS(tr[i].x,tr[i].y);ctx.lineTo(p.x,p.y);}ctx.stroke();ctx.restore();}
function drawShipShape(sx,sy,crs,color,sz){const rad=(crs-90)*Math.PI/180,L=sz*2.2,B=sz*.4;ctx.save();ctx.translate(sx,sy);ctx.rotate(rad);ctx.beginPath();ctx.moveTo(L,0);ctx.bezierCurveTo(L*.6,-B*.6,L*.3,-B,0,-B);ctx.lineTo(-L*.6,-B*.85);ctx.quadraticCurveTo(-L,-B*.5,-L*.9,0);ctx.quadraticCurveTo(-L,B*.5,-L*.6,B*.85);ctx.lineTo(0,B);ctx.bezierCurveTo(L*.3,B,L*.6,B*.6,L,0);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=.6;ctx.stroke();ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-L*.15,-B*.4,L*.35,B*.8);ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(L*.45,0,B*.35,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-L*.35,0,B*.35,0,Math.PI*2);ctx.fill();ctx.restore();}

function drawShip(s,time){
  if(s.sunk&&time>s.sunk+3){const sp=colShipPos(s,s.sunk),p=toS(sp.x,sp.y);ctx.save();ctx.fillStyle='#ff4444';ctx.font='13px serif';ctx.fillText('✕',p.x-5,p.y+4);ctx.globalAlpha=.7;ctx.font='bold 10px sans-serif';ctx.fillText(s.kr,p.x+10,p.y+3);ctx.restore();return;}
  const pos=colShipPos(s,time);recordTrack(s,pos);const p=toS(pos.x,pos.y);
  if(s.sunk&&time>=s.sunk&&time<=s.sunk+3){const f=(time-s.sunk)/3;ctx.save();ctx.globalAlpha=1-f*.6;drawShipShape(p.x,p.y,pos.crs,'#ff4400',10);const r=5+f*40,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,`rgba(255,200,50,${1-f})`);g.addColorStop(.5,`rgba(255,60,0,${.7-f*.7})`);g.addColorStop(1,'rgba(80,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff6b6b';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(s.kr+' 폭발!',p.x,p.y-r-8);ctx.restore();return;}
  const sz=hsfShips.includes(s)||gfShips.includes(s)?8:10;
  drawShipShape(p.x,p.y,pos.crs,s.c,sz);
  ctx.save();ctx.fillStyle=s.c;ctx.font='bold 11px sans-serif';ctx.globalAlpha=.9;ctx.fillText(s.kr,p.x+14,p.y+4);ctx.restore();
}

function drawFiring(time){const now=performance.now();for(const f of firingTable){if(time<f.t0||time>f.t1)continue;const fs=allShips.find(s=>s.id===f.from),ts=allShips.find(s=>s.id===f.to);if(!fs||!ts)continue;if(fs.sunk&&time>fs.sunk)continue;if(ts.sunk&&time>ts.sunk)continue;const phase=Math.sin(now*.003+f.from.charCodeAt(0)*7);if(phase<-.3)continue;const fp=colShipPos(fs,time),tp=colShipPos(ts,time),p1=toS(fp.x,fp.y),p2=toS(tp.x,tp.y);ctx.save();ctx.globalAlpha=.12+phase*.05;ctx.strokeStyle=f.c;ctx.lineWidth=1;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();ctx.setLineDash([]);const ax=lerp(p1.x,p2.x,.75),ay=lerp(p1.y,p2.y,.75),ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);ctx.globalAlpha=.25;ctx.fillStyle=f.c;ctx.beginPath();ctx.moveTo(ax+Math.cos(ang)*6,ay+Math.sin(ang)*6);ctx.lineTo(ax+Math.cos(ang+2.5)*5,ay+Math.sin(ang+2.5)*5);ctx.lineTo(ax+Math.cos(ang-2.5)*5,ay+Math.sin(ang-2.5)*5);ctx.closePath();ctx.fill();if(phase>.5){ctx.globalAlpha=.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p2.x+(Math.random()-.5)*10,p2.y+(Math.random()-.5)*10,1.5,0,Math.PI*2);ctx.fill();}ctx.restore();}}

const events=[
  {t:1080,text:'18:00 — 대함대 24척, 6열 종대에서 단일 전투대열로 전개 시작',dur:5},
  {t:1085,text:'젤리코: "적의 주력함대는 어디에 있는가?" — 비티로부터의 정보는 극히 부실',dur:4},
  {t:1095,text:'18:15 — 젤리코, 좌익 종대 기준 전개 명령! 나침반을 20초간 응시한 뒤 "명료하고 단호한 목소리"로',dur:5,crit:true},
  {t:1098,text:'18:18 — 아버스넛, 비스바덴을 향해 돌진! 양 함대 사이를 가로질러 진격',dur:4},
  {t:1100,text:'💥 18:20 — 디펜스 폭발 침몰! 뤼초프의 5회 일제사격 중 3회 협차. 903명 전원 사망',dur:5,crit:true},
  {t:1105,text:'18:25 — 워스파이트 조타 고장! 적을 향해 두 바퀴 선회. 독일 전함 8척 이상이 집중포화',dur:5,crit:true},
  {t:1108,text:'"북쪽에서 동쪽으로 이어지는 수평선 전체가 불바다였다" — 셰어의 기함에서',dur:4},
  {t:1112,text:'18:32 — 뤼초프와 데르플링거, 인빈시블을 포착. "이 골칫덩어리를 눈앞에 두게 된 만족감"',dur:4},
  {t:1114,text:'💥 18:34 — 인빈시블 Q포탑 폭발! 함체 두 동강. 1,026명 사망, 6명 생존. 후드 소장 전사',dur:5,crit:true},
  {t:1120,text:'18:40 — 쾨니히, 아이언 듀크로부터 13.5인치 포탄 7발 피격. 좌현 4.5도 경사',dur:4,crit:true},
  {t:1123,text:'셰어, 대함대 전체와 맞닥뜨렸음을 깨닫다. 이탈을 준비...',dur:3},
];

function showEvent(time){const el=document.getElementById('event');let a=null;for(const ev of events){if(time>=ev.t&&time<ev.t+(ev.dur||3))a=ev;}if(a){el.style.display='block';el.textContent=a.text;el.className=a.crit?'critical':'';}else el.style.display='none';}

function handleHover(e){const mx=e.clientX,my=e.clientY,tip=document.getElementById('tooltip');let found=null;for(const s of allShips){if(s.sunk&&t>s.sunk+3)continue;const pos=colShipPos(s,t),p=toS(pos.x,pos.y);if(Math.hypot(p.x-mx,p.y-my)<20){found=s;break;}}if(found){const pos=colShipPos(found,t);tip.style.display='block';tip.style.left=(mx+18)+'px';tip.style.top=(my-15)+'px';let html=`<b>${found.kr}</b><br>침로: ${Math.round(pos.crs)}°`;const firing=firingTable.find(f=>f.from===found.id&&t>=f.t0&&t<=f.t1);if(firing){const tgt=allShips.find(s=>s.id===firing.to);if(tgt)html+=`<br>교전: <b style="color:${tgt.c}">${tgt.kr}</b>`;}const inc=firingTable.filter(f=>f.to===found.id&&t>=f.t0&&t<=f.t1);if(inc.length)html+=`<br>피격: ${inc.map(f=>{const a=allShips.find(s=>s.id===f.from);return a?`<b style="color:${a.c}">${a.kr}</b>`:''}).join(', ')}`;if(found.sunk)html+=`<br><span style="color:#ff6b6b">침몰: ${fmtTime(found.sunk)}</span>`;tip.innerHTML=html;}else tip.style.display='none';}

function updateView(time){const bp=colShipPos(gfShips[0],time),gp=colShipPos(sg1Ships[0],time);const cx=(bp.x+gp.x)/2,cy=(bp.y+gp.y)/2;viewX+=(cx-viewX)*.04;viewY+=(cy-viewY)*.04;}

function draw(){autoScale();drawSea();allShips.forEach(s=>drawTrack(s));drawFiring(t);hsfKaiserShips.forEach(s=>drawShip(s,t));hsf3Ships.forEach(s=>drawShip(s,t));sg1Ships.forEach(s=>drawShip(s,t));cs1Ships.forEach(s=>drawShip(s,t));bcs3Ships.forEach(s=>drawShip(s,t));bs5Ships.forEach(s=>drawShip(s,t));gfDiv6Ships.forEach(s=>drawShip(s,t));gfDiv5Ships.forEach(s=>drawShip(s,t));gfDiv4Ships.forEach(s=>drawShip(s,t));gfDiv3Ships.forEach(s=>drawShip(s,t));gfDiv2Ships.forEach(s=>drawShip(s,t));gfDiv1Ships.forEach(s=>drawShip(s,t));bcfShips.forEach(s=>drawShip(s,t));showEvent(t);document.getElementById('timeDisplay').textContent=fmtTime(t);document.getElementById('timeline').value=((t-T0)/(T1-T0))*10000;}

function fmtTime(m){return`${Math.floor(m/60)}:${String(Math.floor(m%60)).padStart(2,'0')}`;}
function animate(ts){if(!playing)return;if(!lastTs)lastTs=ts;const dt=(ts-lastTs)/1000;lastTs=ts;t+=dt*speed*.4;if(t>=T1){t=T1;playing=false;document.getElementById('playBtn').textContent='▶ 재생';}if(!dragging)updateView(t);draw();raf=requestAnimationFrame(animate);}
function togglePlay(){playing=!playing;if(playing){if(t>=T1){t=T0;resetTracks();}document.getElementById('playBtn').textContent='⏸ 일시정지';lastTs=0;raf=requestAnimationFrame(animate);}else{document.getElementById('playBtn').textContent='▶ 재생';cancelAnimationFrame(raf);}}
function seek(v){const nt=T0+(v/10000)*(T1-T0);if(nt<t)resetTracks();t=nt;for(let tt=T0;tt<=t;tt+=.3)allShips.forEach(s=>recordTrack(s,colShipPos(s,tt)));updateView(t);draw();}
function changeSpeed(){const sp=[.5,1,2,4,8];speed=sp[(sp.indexOf(speed)+1)%sp.length];document.getElementById('spdBtn').textContent=speed+'x';}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay();}if(e.code==='ArrowRight'){t=Math.min(t+.5,T1);draw();}if(e.code==='ArrowLeft'){t=Math.max(t-.5,T0);draw();}});

autoScale();updateView(T0);draw();
</script>
