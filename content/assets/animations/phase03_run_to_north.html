let viewX=3, viewY=5, zoom=1.0, scale=30;
function autoScale(){scale=Math.min(W,H)/24*zoom;}
autoScale();
function toS(x,y){return{x:W/2+(x-viewX)*scale,y:H/2-(y-viewY)*scale};}

C.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY>0?0.9:1.1;zoom=Math.max(0.3,Math.min(3,zoom));autoScale();draw();},{passive:false});
let dragging=false,dragX,dragY;
C.addEventListener('mousedown',e=>{dragging=true;dragX=e.clientX;dragY=e.clientY;});
C.addEventListener('mousemove',e=>{if(dragging){viewX-=(e.clientX-dragX)/scale;viewY+=(e.clientY-dragY)/scale;dragX=e.clientX;dragY=e.clientY;draw();}handleHover(e);});
C.addEventListener('mouseup',()=>dragging=false);

function lerp(a,b,f){return a+(b-a)*f;}
function lerpA(a,b,f){let d=b-a;if(d>180)d-=360;if(d<-180)d+=360;return a+d*f;}
function posAt(wp,time){
  if(time<=wp[0].t)return wp[0];if(time>=wp[wp.length-1].t)return wp[wp.length-1];
  for(let i=0;i<wp.length-1;i++){if(time>=wp[i].t&&time<=wp[i+1].t){const f=(time-wp[i].t)/(wp[i+1].t-wp[i].t);return{x:lerp(wp[i].x,wp[i+1].x,f),y:lerp(wp[i].y,wp[i+1].y,f),crs:lerpA(wp[i].crs,wp[i+1].crs,f)};}}
  return wp[0];
}
function makeCol(lead,ships,gap){
  const SPD=22,DELAY=(gap/SPD)*60;
  return ships.map((s,i)=>({...s,delay:i*DELAY,leadWp:lead}));
}
function colShipPos(ship,time){
  const lt=time-ship.delay,wp=ship.leadWp;
  if(lt<wp[0].t){const dt=(wp[0].t-lt)/60,r=(wp[0].crs+180)*Math.PI/180;return{x:wp[0].x+Math.sin(r)*dt*22,y:wp[0].y+Math.cos(r)*dt*22,crs:wp[0].crs};}
  return posAt(wp,lt);
}

// ═══════════════════════════════════════
// TRACKS / DRAWING
// ═══════════════════════════════════════

const tracks={};
function recordTrack(s,p){if(!tracks[s.id])tracks[s.id]=[];const tr=tracks[s.id];if(tr.length===0||Math.hypot(tr[tr.length-1].x-p.x,tr[tr.length-1].y-p.y)>0.03)tr.push({x:p.x,y:p.y});}
function resetTracks(){for(const k in tracks)delete tracks[k];}

function drawSea(){
  ctx.fillStyle='#0d1b2a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(100,140,180,0.06)';ctx.lineWidth=1;
  for(let x=-20;x<=30;x+=2){const a=toS(x,-30),b=toS(x,40);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  for(let y=-30;y<=40;y+=2){const a=toS(-20,y),b=toS(30,y);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='bold 14px sans-serif';
  const n=toS(viewX-W/scale/2+1.5,viewY+H/scale/2-1);ctx.fillText('N↑',n.x,n.y);
}

function drawTrack(s){const tr=tracks[s.id];if(!tr||tr.length<2)return;ctx.save();ctx.strokeStyle=s.c;ctx.globalAlpha=0.2;ctx.lineWidth=1.5;ctx.beginPath();let p=toS(tr[0].x,tr[0].y);ctx.moveTo(p.x,p.y);for(let i=1;i<tr.length;i++){p=toS(tr[i].x,tr[i].y);ctx.lineTo(p.x,p.y);}ctx.stroke();ctx.restore();}

function drawShipShape(sx,sy,crs,color,sz){
  const rad=(crs-90)*Math.PI/180,L=sz*2.2,B=sz*0.4;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(rad);
  ctx.beginPath();ctx.moveTo(L,0);
  ctx.bezierCurveTo(L*0.6,-B*0.6,L*0.3,-B,0,-B);ctx.lineTo(-L*0.6,-B*0.85);
  ctx.quadraticCurveTo(-L,-B*0.5,-L*0.9,0);ctx.quadraticCurveTo(-L,B*0.5,-L*0.6,B*0.85);
  ctx.lineTo(0,B);ctx.bezierCurveTo(L*0.3,B,L*0.6,B*0.6,L,0);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=0.6;ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(-L*0.15,-B*0.4,L*0.35,B*0.8);
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(L*0.45,0,B*0.35,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-L*0.35,0,B*0.35,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawShip(s,time){
  const pos=colShipPos(s,time);recordTrack(s,pos);
  const p=toS(pos.x,pos.y);
  const sz=hsfShips.includes(s)?8:10;
  drawShipShape(p.x,p.y,pos.crs,s.c,sz);
  ctx.save();ctx.fillStyle=s.c;ctx.font='bold 11px sans-serif';ctx.globalAlpha=0.9;
  ctx.fillText(s.kr,p.x+14,p.y+4);ctx.restore();
}

function drawFiring(time){
  const now=performance.now();
  for(const f of firingTable){
    if(time<f.t0||time>f.t1)continue;
    const fs=allShips.find(s=>s.id===f.from),ts=allShips.find(s=>s.id===f.to);
    if(!fs||!ts)continue;
    const phase=Math.sin(now*0.003+f.from.charCodeAt(0)*7);
    if(phase<-0.3)continue;
    const fp=colShipPos(fs,time),tp=colShipPos(ts,time);
    const p1=toS(fp.x,fp.y),p2=toS(tp.x,tp.y);
    ctx.save();ctx.globalAlpha=0.12+phase*0.05;ctx.strokeStyle=f.c;ctx.lineWidth=1;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();ctx.setLineDash([]);
    const ax=lerp(p1.x,p2.x,0.75),ay=lerp(p1.y,p2.y,0.75),ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    ctx.globalAlpha=0.25;ctx.fillStyle=f.c;ctx.beginPath();
    ctx.moveTo(ax+Math.cos(ang)*6,ay+Math.sin(ang)*6);
    ctx.lineTo(ax+Math.cos(ang+2.5)*5,ay+Math.sin(ang+2.5)*5);
    ctx.lineTo(ax+Math.cos(ang-2.5)*5,ay+Math.sin(ang-2.5)*5);ctx.closePath();ctx.fill();
    if(phase>0.5){ctx.globalAlpha=0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p2.x+(Math.random()-0.5)*10,p2.y+(Math.random()-0.5)*10,1.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}

  {t:1025,text:'17:05 — 셰어, "적에게 달려들어라!" (Ran an den Feind). 대양함대 전속 추격 개시',dur:4},
  {t:1033,text:'17:13 — 히퍼, 비티 추격 포기. 제5전함전대와 정면 대치 선택',dur:4,crit:true},
  {t:1038,text:'17:18 — 폰 데어 탄, 15인치 포탄에 A·B·C·D 주포 전문 사용 불능! 그래도 대열 유지',dur:5,crit:true},
  {t:1045,text:'17:25 — 쾨니히급 드레드노트, 제5전함전대 사거리 진입. 분당 6–9회 일제사격',dur:4},
  {t:1050,text:'💥 17:30 — 말라야 우현 포대 피격! 코다이트 화재 → 104명 사상. 15인치 탄약고 위기',dur:5,crit:true},
  {t:1055,text:'17:35 — 말라야 흘수선 하 피격, 4도 경사! 중유 이송으로 복원. 기관실 영웅적 대응',dur:5,crit:true},
  {t:1060,text:'17:40 — 뤼초프 무선실 파괴 → 히퍼-셰어 간 통신 두절',dur:4},
  {t:1063,text:'자이들리츠 전쟁일지: "소름 끼칠 정도로 강력한 사격. 대응이 불가능했다"',dur:4},
  {t:1067,text:'17:47 — 후드의 제3순양전함전대(인빈시블·인플렉시블·인도미터블), 동쪽에서 도착!',dur:4},
  {t:1072,text:'폰 하제: "매우 우울하고 짜증스러운 일. 적이 사거리 밖에서 일방적으로 포격"',dur:4},
  {t:1078,text:'17:58 — 양측 모두 큰 피해. 북쪽에서 대함대 접근 중. 함대 결전이 임박하다',dur:3},
];

function showEvent(time){const el=document.getElementById('event');let a=null;for(const ev of events){if(time>=ev.t&&time<ev.t+(ev.dur||3))a=ev;}if(a){el.style.display='block';el.textContent=a.text;el.className=a.crit?'critical':'';}else{el.style.display='none';}}

function handleHover(e){
  const mx=e.clientX,my=e.clientY,tip=document.getElementById('tooltip');
  let found=null;
  for(const s of allShips){const pos=colShipPos(s,t),p=toS(pos.x,pos.y);if(Math.hypot(p.x-mx,p.y-my)<20){found=s;break;}}
  if(found){
    const pos=colShipPos(found,t);tip.style.display='block';tip.style.left=(mx+18)+'px';tip.style.top=(my-15)+'px';
    let html=`<b>${found.kr}</b><br>침로: ${Math.round(pos.crs)}°`;
    const firing=firingTable.find(f=>f.from===found.id&&t>=f.t0&&t<=f.t1);
    if(firing){const tgt=allShips.find(s=>s.id===firing.to);if(tgt)html+=`<br>교전: <b style="color:${tgt.c}">${tgt.kr}</b>`;}
    const inc=firingTable.filter(f=>f.to===found.id&&t>=f.t0&&t<=f.t1);
    if(inc.length)html+=`<br>피격: ${inc.map(f=>{const a=allShips.find(s=>s.id===f.from);return a?`<b style="color:${a.c}">${a.kr}</b>`:''}).join(', ')}`;
    tip.innerHTML=html;
  }else tip.style.display='none';
}

function updateView(time){
  // Follow center of 5th BS and SG1
  const bp=colShipPos(bs5Ships[0],time),gp=colShipPos(sg1Ships[0],time);
  const cx=(bp.x+gp.x)/2,cy=(bp.y+gp.y)/2;
  viewX+=(cx-viewX)*0.04;viewY+=(cy-viewY)*0.04;
}

function draw(){
  autoScale();drawSea();
  allShips.forEach(s=>drawTrack(s));
  drawFiring(t);
  hsf2Ships.forEach(s=>drawShip(s,t));
  hsfKaiserShips.forEach(s=>drawShip(s,t));
  hsf3Ships.forEach(s=>drawShip(s,t));
  sg1Ships.forEach(s=>drawShip(s,t));
  bcs3Ships.forEach(s=>drawShip(s,t));
  bs5Ships.forEach(s=>drawShip(s,t));
  bcfShips.forEach(s=>drawShip(s,t));
  showEvent(t);
  document.getElementById('timeDisplay').textContent=fmtTime(t);
  document.getElementById('timeline').value=((t-T0)/(T1-T0))*10000;
}

function fmtTime(m){return`${Math.floor(m/60)}:${String(Math.floor(m%60)).padStart(2,'0')}`;}
function animate(ts){if(!playing)return;if(!lastTs)lastTs=ts;const dt=(ts-lastTs)/1000;lastTs=ts;t+=dt*speed*0.4;if(t>=T1){t=T1;playing=false;document.getElementById('playBtn').textContent='▶ 재생';}if(!dragging)updateView(t);draw();raf=requestAnimationFrame(animate);}
function togglePlay(){playing=!playing;if(playing){if(t>=T1){t=T0;resetTracks();}document.getElementById('playBtn').textContent='⏸ 일시정지';lastTs=0;raf=requestAnimationFrame(animate);}else{document.getElementById('playBtn').textContent='▶ 재생';cancelAnimationFrame(raf);}}
function seek(v){const nt=T0+(v/10000)*(T1-T0);if(nt<t)resetTracks();t=nt;for(let tt=T0;tt<=t;tt+=0.3)allShips.forEach(s=>recordTrack(s,colShipPos(s,tt)));updateView(t);draw();}
function changeSpeed(){const sp=[0.5,1,2,4,8];speed=sp[(sp.indexOf(speed)+1)%sp.length];document.getElementById('spdBtn').textContent=speed+'x';}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay();}if(e.code==='ArrowRight'){t=Math.min(t+0.5,T1);draw();}if(e.code==='ArrowLeft'){t=Math.max(t-0.5,T0);draw();}});

autoScale();updateView(T0);draw();
</script>
